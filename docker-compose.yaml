services:
  edge:
    image: nginx:alpine
    container_name: flash-sale-edge
    ports:
      - "1234:1234" # Exposed to host clients
    volumes:
      - ./services/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - load_balancer
    networks:
      - flash-sale-net

  load_balancer:
    image: nginx:alpine
    container_name: flash-sale-lb
    ports:
      - "8080:8080" # Optional: Direct access bypassing edge for testing
    volumes:
      - ./services/load_balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-service
    networks:
      - flash-sale-net

  api-service:
    build:
      context: ./services/api
    deploy:
      replicas: 3
    environment:
      - PORT=5300
    networks:
      - flash-sale-net

networks:
  flash-sale-net:
    driver: bridge
