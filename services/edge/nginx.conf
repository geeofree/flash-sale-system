events { worker_connections 1024; }

http {
  # 1. Setup in-memory cache storage (10MB metadata, 1GB data)
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=1g inactive=10s use_temp_path=off;

  upstream load_balancer {
    # Points to your API Gateway or Load Balancer container/port
    server load_balancer:8080; 
  }

  server {
    listen 1234;

    # Visual indicator to check if the CDN served the cache or went to origin
    add_header X-Cache-Status $upstream_cache_status;

    # ROUTE 1: Cache the sale status endpoint for 2 seconds
    location /api/sales/status {
      proxy_pass http://load_balancer;

      proxy_cache cdn_cache;
      proxy_cache_valid 200 1s; # Caches successful HTTP 200 responses for 2 sec

      # Ensures only ONE request goes to the API service when the cache expires;
      # all other incoming requests wait for the cache to update or receive stale data.
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout;

      # Ensures HEAD/GET are cached properly
      proxy_cache_key "$scheme$request_method$host$request_uri";
    }

    # ROUTE 2: Pass purchase requests straight to API without caching
    location /api/products/purchase {
      proxy_pass http://load_balancer;
      proxy_cache off; # Explicitly bypass cache for POST requests
    }

    # ROUTE 3: Fallback for all other traffic
    location / {
      proxy_pass http://load_balancer;
    }
  }
}
