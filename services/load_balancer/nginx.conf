worker_processes auto;
worker_rlimit_nofile 100000;

events {
  worker_connections 20480;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  # Performance Settings
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  keepalive_requests 10000;

  # Docker Embedded DNS Resolver
  resolver 127.0.0.11 valid=5s ipv6=off;

  # ------------------------------------------------------------------
  # BACKEND POOL (Unified API Service Cluster)
  # ------------------------------------------------------------------
  upstream api_backend {
    least_conn; # Routes incoming traffic to the container with fewest active requests

    # Points to the Docker service name 'api-service'
    # Docker's internal DNS will automatically round-robin across all scaled instances
    server api-service:5300 max_fails=2 fail_timeout=3s max_conns=2000;

    keepalive 64; # Persistent connection pool to reduce TCP overhead
  }

  # ------------------------------------------------------------------
  # SERVER CONFIGURATION
  # ------------------------------------------------------------------
  server {
    listen 8080 reuseport;
    server_name localhost;

    # Forward Original Client Headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Timeouts
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    # WRITE PATH: Purchase Endpoint
    location /api/products/purchase {
      proxy_pass http://api_backend;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    # READ PATH: Status Endpoint
    location /api/sales/status {
      proxy_pass http://api_backend;
    }

    # DEFAULT CATCH-ALL (Auth / Status / Purchase Checks)
    location / {
      proxy_pass http://api_backend;
    }
  }
}
